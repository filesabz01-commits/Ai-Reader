name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and build
        run: |
          unzip -q AIReader.zip -d work
          cd work/AIReader
          gradle assembleDebug --no-daemon --info
      - uses: actions/upload-artifact@v4
        with:
          name: AIReader-APK
          path: work/AIReader/app/build/outputs/apk/debug/app-debug.apk
          
