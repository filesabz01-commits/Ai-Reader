name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and build
        run: |
          unzip -q AIReader.zip -d work
          cd work/AIReader
          set +e
          gradle assembleDebug --no-daemon --console=plain > ../build.log 2>&1
          code=$?
          grep -E "^e: " ../build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/work/AIReader/app/src/main/java/app/aireader/##' > ../errors.txt
          cat ../errors.txt
          while read -r l; do echo "::error::$l"; done < ../errors.txt
          cp ../errors.txt "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: AIReader-APK
          path: work/AIReader/app/build/outputs/apk/debug/app-debug.apk
